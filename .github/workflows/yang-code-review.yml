name: YangYang Code Review (YCR)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: yang-code-review
        uses: yangyang-research/yang-code-review@main
        with:
          PROVIDER: openai
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_NAME: gpt-5.4
          MODEL_TEMPERATURE: 0.2
          GITHUB_TOKEN: ${{ github.token }}

