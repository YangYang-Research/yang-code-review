name: YangYang Code Review (YCR)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: write
      actions: write
    steps:
      - name: yang-code-review
        uses: yangyang-research/yang-code-review@main
        with:
          PROVIDER: yangyang
          API_KEY: ${{ secrets.YANG_API_TOKEN }}
          MODEL_NAME: auto
          MODEL_TEMPERATURE: 0.7
          GITHUB_TOKEN: ${{ github.token }}
