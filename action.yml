name: yang-code-review
description: YangYang Code Review (YCR)
author: yangyang-organization

inputs:
  PROVIDER:
    description: AI provider (openai, anthropic, google, nvidia, openrouter, or yangyang)
    required: true
  API_KEY:
    description: API key for the selected provider
    required: true
  MODEL_NAME:
    description: Provider model identifier
    required: true
  MODEL_TEMPERATURE:
    description: Optional model temperature between 0 and 1; omitted by default for model compatibility
    required: false
  MAX_TOKENS:
    description: Maximum number of output tokens
    required: false
    default: "4096"
  GITHUB_TOKEN:
    description: GitHub token for PR comments
    required: true

outputs:
  sarif_path:
    description: Absolute path to the generated SARIF file
    value: ${{ steps.review.outputs.sarif_path }}
  md_path:
    description: Absolute path to the generated markdown report
    value: ${{ steps.review.outputs.md_path }}
  artifact_name:
    description: Uploaded Actions artifact name
    value: ${{ steps.review.outputs.artifact_name }}
  findings_count:
    description: Number of structured findings parsed into SARIF
    value: ${{ steps.review.outputs.findings_count }}

branding:
  icon: "shield"
  color: "red"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - id: review
      shell: bash
      run: node "$GITHUB_ACTION_PATH/dist/index.js"
      env:
        INPUT_PROVIDER: ${{ inputs.PROVIDER }}
        INPUT_API_KEY: ${{ inputs.API_KEY }}
        INPUT_MODEL_NAME: ${{ inputs.MODEL_NAME }}
        INPUT_MODEL_TEMPERATURE: ${{ inputs.MODEL_TEMPERATURE }}
        INPUT_MAX_TOKENS: ${{ inputs.MAX_TOKENS }}
        INPUT_GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}

    - name: Upload report artifact
      if: steps.review.outputs.artifact_name != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.review.outputs.artifact_name }}
        path: |
          ${{ steps.review.outputs.md_path }}
          ${{ steps.review.outputs.sarif_path }}
        retention-days: 90
        if-no-files-found: warn

    - name: Upload SARIF to code scanning
      if: steps.review.outputs.sarif_path != ''
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.review.outputs.sarif_path }}
        category: yang-code-review
