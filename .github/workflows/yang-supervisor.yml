name: Yang Supervisor Agent (YSA)

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  supervise:
    runs-on: ubuntu-24.04
    steps:
      - name: yang-supervisor
        uses: YangYang-Research/yang-supervisor@v0.1.0
        with:
          PROVIDER: yangyang
          API_KEY: ${{ secrets.YANG_API_TOKEN }}
          MODEL_NAME: auto
          GITHUB_TOKEN: ${{ github.token }}
