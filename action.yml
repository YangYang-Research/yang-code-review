name: yang-code-review
description: YangYang Code Review (YCR)
author: yangyang-organization

inputs:
  PROVIDER:
    description: AI provider (openai, anthropic, google, nvidia, openrouter, or yangyang)
    required: true
  API_KEY:
    description: API key for the selected provider
    required: true
  MODEL_NAME:
    description: Provider model identifier
    required: true
  MODEL_TEMPERATURE:
    description: Optional model temperature between 0 and 1; omitted by default for model compatibility
    required: false
  MAX_TOKENS:
    description: Maximum number of output tokens
    required: false
    default: "4096"
  GITHUB_TOKEN:
    description: GitHub token for PR comments and code scanning SARIF upload
    required: true

outputs:
  sarif_path:
    description: Absolute path to the generated SARIF file
  artifact_name:
    description: Uploaded Actions artifact name
  findings_count:
    description: Number of structured findings parsed into SARIF

branding:
  icon: "shield"
  color: "red"

runs:
  using: node24
  main: dist/index.js